<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <linearGradient id="dashLaser_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="1" />
      <stop offset="100%" stop-color="#DD0031" stop-opacity="0" />
    </linearGradient>
    <filter id="dashShadow_light" x="-3%" y="-4%" width="106%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.07" />
    </filter>
  </defs>

  <rect x="2" y="2" width="896" height="226" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#dashShadow_light)" />
  
  <rect x="2" y="2" width="896" height="226" rx="14" fill="none" stroke="url(#dashLaser_light)" stroke-width="2" stroke-dasharray="120 600" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="0;-1440" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- LEFT: Profile Performance -->
  <g transform="translate(30, 26)">
    <circle cx="8" cy="8" r="4.5" fill="#6366F1" />
    <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#0F172A">⚡ GitHub Performance &amp; Activity</text>
    <line x1="0" y1="26" x2="390" y2="26" stroke="#E2E8F0" stroke-width="1" />

    <g transform="translate(0, 52)">
      <circle cx="8" cy="-4" r="4.5" fill="#4F46E5" />
      <text x="22" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748B">Public Repositories</text>
      <text x="385" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#0F172A">17</text>
    </g>

    <g transform="translate(0, 84)">
      <circle cx="8" cy="-4" r="4.5" fill="#0284C7" />
      <text x="22" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748B">Architecture Specialization</text>
      <text x="385" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12.5" fill="#0284C7">MEAN Stack Architect</text>
    </g>

    <g transform="translate(0, 116)">
      <circle cx="8" cy="-4" r="4.5" fill="#10B981" />
      <text x="22" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748B">Continental Competition</text>
      <text x="385" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12.5" fill="#10B981">Top 3 in Africa (Huawei 2025)</text>
    </g>

    <g transform="translate(0, 148)">
      <circle cx="8" cy="-4" r="4.5" fill="#DD0031" />
      <text x="22" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748B">Cybersecurity Organization</text>
      <text x="385" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12.5" fill="#DD0031">Co-Founder @ VulnCraft</text>
    </g>
  </g>

  <!-- Center Divider with Pulsing Point -->
  <line x1="450" y1="26" x2="450" y2="204" stroke="#E2E8F0" stroke-width="1.2" />
  <circle cx="450" cy="115" r="4" fill="#4F46E5">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- RIGHT: Most Used Languages & Stack -->
  <g transform="translate(480, 26)">
    <circle cx="8" cy="8" r="4.5" fill="#0284C7" />
    <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#0F172A">💻 Most Used Languages &amp; Core Stack</text>
    <line x1="0" y1="26" x2="390" y2="26" stroke="#E2E8F0" stroke-width="1" />

    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="380" height="11" rx="5" fill="#E2E8F0" />
      <rect x="0" y="0" width="179" height="11" rx="5" fill="#E34F26">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="179" y="0" width="152" height="11"  fill="#3178C6">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="331" y="0" width="27" height="11"  fill="#3776AB">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="358" y="0" width="22" height="11" rx="5" fill="#F7DF1E">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite" />
      </rect>
    </g>

    <g transform="translate(0, 78)">
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="4.5" fill="#E34F26" />
        <text x="16" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#0F172A">HTML / SCSS</text>
        <text x="165" y="10" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#64748B">47%</text>
      </g>
      <g transform="translate(190, 0)">
        <circle cx="6" cy="6" r="4.5" fill="#3178C6" />
        <text x="16" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#0F172A">TypeScript</text>
        <text x="165" y="10" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#64748B">40%</text>
      </g>
      <g transform="translate(0, 26)">
        <circle cx="6" cy="6" r="4.5" fill="#3776AB" />
        <text x="16" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#0F172A">Python</text>
        <text x="165" y="10" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#64748B">7%</text>
      </g>
      <g transform="translate(190, 26)">
        <circle cx="6" cy="6" r="4.5" fill="#F7DF1E" />
        <text x="16" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#0F172A">JavaScript</text>
        <text x="165" y="10" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#64748B">7%</text>
      </g>
    </g>
  </g>
</svg>