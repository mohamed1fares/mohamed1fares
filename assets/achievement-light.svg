<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="100%" height="100%">
  <defs>
    <linearGradient id="achieveGrad_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="achieveLaser_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="1" />
      <stop offset="100%" stop-color="#DD0031" stop-opacity="0" />
    </linearGradient>

    <filter id="achieveShadow_light" x="-3%" y="-4%" width="106%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.07" />
    </filter>
  </defs>

  <rect x="2" y="2" width="896" height="136" rx="14" fill="url(#achieveGrad_light)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#achieveShadow_light)" />

  <!-- Animated Laser Perimeter Highlight -->
  <rect x="2" y="2" width="896" height="136" rx="14" fill="none" stroke="url(#achieveLaser_light)" stroke-width="2" stroke-dasharray="100 500" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="0;-1200" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Accent bar left with animated glow -->
  <path d="M 4 16 Q 4 4 16 4 L 18 4 L 18 136 L 16 136 Q 4 136 4 124 Z" fill="#DD0031">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Trophy Icon with Glowing Ring -->
  <g transform="translate(34, 30)">
    <circle cx="36" cy="36" r="32" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="1.2">
      <animate attributeName="r" values="30;36;30" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    
    <path d="M 26 22 L 46 22 L 46 32 C 46 38 42 44 36 44 C 30 44 26 38 26 32 Z" fill="#D97706" />
    <path d="M 22 24 C 18 24 17 28 19 32 C 21 36 26 38 26 38" stroke="#D97706" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 50 24 C 54 24 55 28 53 32 C 51 36 46 38 46 38" stroke="#D97706" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <line x1="36" y1="44" x2="36" y2="52" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="52" x2="44" y2="52" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
    
    <polygon points="36,12 38,18 44,18 39,21 41,27 36,23 31,27 33,21 28,18 34,18" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Content Center -->
  <g transform="translate(120, 26)">
    <rect x="0" y="0" width="180" height="20" rx="10" fill="#D97706" fill-opacity="0.15" stroke="#D97706" stroke-width="0.8" />
    <text x="90" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#D97706">CONTINENTAL RECOGNITION</text>

    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="19" fill="#0F172A">Huawei ICT Competition 2025 • 3rd Place in Africa</text>
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#22D3EE">Co-Founder &amp; Platform Architect at VulnCraft (vulncraft.software)</text>
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#64748B">Awarded for excellence in enterprise distributed architecture, automated threat scanning, and cloud scalability.</text>
  </g>

  <!-- Right Emblem Badge -->
  <g transform="translate(768, 28)">
    <rect x="0" y="0" width="102" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <circle cx="51" cy="24" r="14" fill="#D97706" fill-opacity="0.15" />
    <text x="51" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#D97706">#3</text>
    <text x="51" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" fill="#0F172A">AFRICA</text>
    <text x="51" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9.5" fill="#64748B">HUAWEI 2025</text>
  </g>
</svg>