<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 165" width="100%" height="100%">
  <defs>
    <filter id="meanShadow_dark" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Card MongoDB -->
  <g transform="translate(10, 10)">
    <animateTransform attributeName="transform" type="translate" values="10,10; 10,6; 10,10" dur="4.5s" begin="0.0s" repeatCount="indefinite" />
    <rect x="0" y="0" width="212" height="145" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="url(#meanShadow_dark)" />
    
    <path d="M 0 12 Q 0 0 12 0 L 200 0 Q 212 0 212 12 L 212 16 L 0 16 Z" fill="#10AA50">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </path>
    
    <circle cx="34" cy="46" r="18" fill="#10AA50" fill-opacity="0.18" stroke="#10AA50" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#10AA50">M</text>
    
    <text x="62" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#E6EDF3">MongoDB</text>
    <text x="62" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#10AA50">Mongoose &amp; Pipelines</text>
    
    <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">Document modeling, high-throughput</text>
    <text x="14" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">aggregation pipelines, indexing &amp;</text>
    <text x="14" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">performance tuning.</text>
    
  </g>
  <!-- Card Express.js -->
  <g transform="translate(233, 10)">
    <animateTransform attributeName="transform" type="translate" values="233,10; 233,6; 233,10" dur="4.5s" begin="0.9s" repeatCount="indefinite" />
    <rect x="0" y="0" width="212" height="145" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="url(#meanShadow_dark)" />
    
    <path d="M 0 12 Q 0 0 12 0 L 200 0 Q 212 0 212 12 L 212 16 L 0 16 Z" fill="#6366F1">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </path>
    
    <circle cx="34" cy="46" r="18" fill="#6366F1" fill-opacity="0.18" stroke="#6366F1" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#6366F1">E</text>
    
    <text x="62" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#E6EDF3">Express.js</text>
    <text x="62" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#6366F1">REST &amp; Middleware</text>
    
    <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">Robust API design, JWT auth,</text>
    <text x="14" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">granular RBAC guards, rate-</text>
    <text x="14" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">limiting &amp; secure routing.</text>
    
  </g>
  <!-- Card Angular 20 -->
  <g transform="translate(456, 10)">
    <animateTransform attributeName="transform" type="translate" values="456,10; 456,6; 456,10" dur="4.5s" begin="1.8s" repeatCount="indefinite" />
    <rect x="0" y="0" width="212" height="145" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="url(#meanShadow_dark)" />
    
    <path d="M 0 12 Q 0 0 12 0 L 200 0 Q 212 0 212 12 L 212 16 L 0 16 Z" fill="#DD0031">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </path>
    
    <circle cx="34" cy="46" r="18" fill="#DD0031" fill-opacity="0.18" stroke="#DD0031" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#DD0031">A</text>
    
    <text x="62" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#E6EDF3">Angular 20</text>
    <text x="62" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#DD0031">Standalone &amp; Signals</text>
    
    <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">Reactive state architecture with</text>
    <text x="14" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">RxJS, Signals, Tailwind/Bootstrap</text>
    <text x="14" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">UI &amp; lazy modules.</text>
    
  </g>
  <!-- Card Node.js -->
  <g transform="translate(679, 10)">
    <animateTransform attributeName="transform" type="translate" values="679,10; 679,6; 679,10" dur="4.5s" begin="2.7s" repeatCount="indefinite" />
    <rect x="0" y="0" width="212" height="145" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="url(#meanShadow_dark)" />
    
    <path d="M 0 12 Q 0 0 12 0 L 200 0 Q 212 0 212 12 L 212 16 L 0 16 Z" fill="#5FA04E">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </path>
    
    <circle cx="34" cy="46" r="18" fill="#5FA04E" fill-opacity="0.18" stroke="#5FA04E" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#5FA04E">N</text>
    
    <text x="62" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#E6EDF3">Node.js</text>
    <text x="62" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#5FA04E">Async Runtime</text>
    
    <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">Event-driven microservices,</text>
    <text x="14" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">background job workers, webhooks &amp;</text>
    <text x="14" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">WhatsApp Business API.</text>
    
  </g>
</svg>