<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="100%">
  <defs>
    <filter id="footShadow_light" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect x="2" y="2" width="896" height="106" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#footShadow_light)" />

  <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="17" fill="#0F172A">🤝 Let's Collaborate &amp; Build Something Great</text>
  <text x="30" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#64748B">Open to full-stack engineering roles, high-scale MEAN architectures &amp; security collaborations.</text>
  <text x="30" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#6366F1">📍 Giza, Egypt <tspan fill="#64748B">• BSc Computer Science (6 October University, June 2026)</tspan></text>

  <!-- Status indicator right -->
  <g transform="translate(680, 36)">
    <rect x="0" y="0" width="180" height="38" rx="19" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1.2" />
    <circle cx="20" cy="19" r="4.5" fill="#10B981">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#10B981">Open for Opportunities</text>
  </g>
</svg>