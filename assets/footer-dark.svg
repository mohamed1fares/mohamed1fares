<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 115" width="100%" height="100%">
  <defs>
    <linearGradient id="footLaser_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <filter id="footShadow_dark" x="-3%" y="-4%" width="106%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect x="2" y="2" width="896" height="111" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="url(#footShadow_dark)" />

  <!-- Animated Laser Perimeter Highlight -->
  <rect x="2" y="2" width="896" height="111" rx="14" fill="none" stroke="url(#footLaser_dark)" stroke-width="2" stroke-dasharray="100 500" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="0;-1200" dur="6s" repeatCount="indefinite" />
  </rect>

  <text x="32" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="17" fill="#E6EDF3">🤝 Let's Collaborate &amp; Build Something Great</text>
  <text x="32" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#8B949E">Open to full-stack engineering roles, high-scale MEAN architectures &amp; security collaborations.</text>
  <text x="32" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#6366F1">📍 Giza, Egypt <tspan fill="#8B949E">• BSc Computer Science (6 October University, June 2026)</tspan></text>

  <!-- Status indicator right -->
  <g transform="translate(670, 38)">
    <rect x="0" y="0" width="195" height="40" rx="20" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1.2" />
    <circle cx="22" cy="20" r="5" fill="#10B981" />
    <circle cx="22" cy="20" r="5" stroke="#10B981" fill="none" stroke-width="1.5">
      <animate attributeName="r" values="5;14" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#10B981">Open for Opportunities</text>
  </g>
</svg>